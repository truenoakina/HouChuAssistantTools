[AutoUpdate]

;当前FTP更新资源的版本
version=5.3

;更新完执行的主程序名称，不带后缀
exename=逅厨系统辅助工具

;更新方式  遍历更新  更新目录所有文件更新至本地（all） 更新目录指定部分文件更新至本地 （part）
upDateType=part

;部分更新时，指定更新，多文件用逗号隔开。在all模式不考虑该值
upDateFiles=逅厨系统辅助工具.exe,逅厨系统辅助工具.exe.config

[FTP]

;FTP连接参数
ftpip=ssusesssstsptYtnsvts7ansamstsuuat
ftpusername=orqodoPplppvhYtofqroY`r[Aq;pqruul
ftppassword=ornpis:rlrsqNN<cusqomsvay`=sptnul

;FTP主目录（工作目录，即连接后直接打开的目录），以“/”结束
MainDir=逅厨系统辅助工具/

;佳之家指令单目录，以“/”结束
